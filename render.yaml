services:
  - type: web
    name: sciloop-frontend
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NEXT_PUBLIC_SCILOOP_AI_API_BASE
        value: /api/sciloop-ai-proxy
      - key: SCILOOP_AI_BACKEND_URL
        sync: false
      - key: FORLOOP_BACKEND_URL
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_STREAM_MODEL
        value: gpt-5

  - type: web
    name: sciloop-forloop-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: AI_PROVIDER
        value: auto
      - key: FRONTEND_ORIGIN
        sync: false
      - key: FORLOOP_ALLOWED_ORIGIN
        sync: false
      - key: SCILOOP_AI_BACKEND_URL
        sync: false
      - key: FORLOOP_DEV_ACCESS_CODE
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: COHERE_API_KEY
        sync: false
      - key: HUGGINGFACE_API_KEY
        sync: false
      - key: STABILITY_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openrouter/free
      - key: GEMINI_MODEL
        value: gemini-2.5-flash

  - type: web
    name: sciloop-ai-backend
    runtime: node
    plan: free
    rootDir: sciloop-backend
    buildCommand: npm install
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: FRONTEND_ORIGIN
        sync: false
      - key: VISUAL_LANGUAGE_LAB_URL
        sync: false
      - key: AI_PROVIDER_TIMEOUT_MS
        value: 15000
      - key: MAX_PROVIDERS_PER_AI_REQUEST
        value: 5
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: COHERE_API_KEY
        sync: false
      - key: HUGGINGFACE_API_KEY
        sync: false
      - key: STABILITY_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openrouter/free
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
